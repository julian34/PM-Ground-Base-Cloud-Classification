[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clouddensenet"
version = "0.1.0"
description = "DenseNet-121 termodifikasi (SE + SCConv + spatial-attn B/R) untuk klasifikasi 7 kelas awan"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy>=1.26,<2.1",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "PyYAML>=6.0",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Ekspor model ke ONNX (untuk Zetane Viewer / Netron) — lihat scripts/export_onnx.py
export = ["onnx>=1.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
